# nginx site config for serving the built web/ frontend and reverse-proxying
# /api/ to the FastAPI backend (api/main.py, port 8001) -- see the README's
# "Deploying the frontend" section for install/build steps.
#
# Install at /etc/nginx/sites-available/lol-accountability-bot and symlink
# into sites-enabled (see README). Adjust `root` if the repo isn't cloned at
# /home/ubuntu/lol-accountability-bot.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /home/ubuntu/lol-accountability-bot/web/dist;
    index index.html;

    # Reverse-proxy everything under /api/ to the FastAPI backend, stripping
    # the /api prefix (the trailing slashes on both `location` and
    # `proxy_pass` are what make nginx do that rewrite). This mirrors
    # web/vite.config.ts's dev-server proxy, so the frontend calls the same
    # relative /api/... paths in both dev and production and the browser
    # never sees a cross-origin request -- see api/auth.py's docstring for
    # why that matters for the session cookie.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the built SPA; fall back to index.html for client-side routes
    # (Dashboard/History/Templates are all client-routed, no server-side
    # route for e.g. /history exists as a real file).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
